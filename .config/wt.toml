# worktrunk project config. Committed and shared — project hooks are arbitrary code,
# so worktrunk requires one interactive approval on first `wt switch -c` here.
# Config carry-over is handled by the GLOBAL user pre-start hook (copy-ignored);
# this file only builds what a fresh worktree can't copy: the dependency env.
# Rollout plan + templates: ~/.claude/plans/2026-07-15-worktrunk-rollout.md

# Interpreter pinned to this repo's measured baseline — never ambient python3,
# which drifts with every brew upgrade. uv fails loudly if 3.12 is missing.
[[pre-start]]
deps = "uv venv --python 3.12 .venv && uv pip install -p .venv -qe ."

# git config is repo-shared once set, so this is mostly defense-in-depth for a
# fresh clone on another machine — but it's what makes .githooks/pre-commit's
# gitleaks gate actually active in every worktree without a manual step.
[[pre-start]]
hooks = "git config core.hooksPath .githooks"

[pre-merge]
test = ".venv/bin/python -m pytest -q"

# data/backups/ holds rotating daily DB snapshots (~8GB each, growing) — a
# launchd backup job's output, not something any worktree needs. The global
# *.db exclude in user config doesn't catch this: `wt step copy-ignored`
# carries data/backups/ as one directory entry (from git's --directory-mode
# ignore listing), so a file-pattern exclude like *.db never gets applied to
# its individual contents. Excluding the directory itself is the only way to
# keep it out (wt-doctor footprint scan, 2026-08-26).
[step.copy-ignored]
exclude = ["data/backups/"]
